// ===== Toast =====
function showToast(message, type = 'info') {
  const colors={success:'#10b981',error:'#ef4444',info:'#3b82f6',warning:'#eab308'};
  const icons={success:'fa-check-circle',error:'fa-exclamation-circle',info:'fa-info-circle',warning:'fa-exclamation-triangle'};
  const toast=document.createElement('div');
  toast.style.cssText=`
    position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-120px);
    background:${colors[type]||colors.info};color:#fff;
    padding:14px 28px;border-radius:60px;font-size:14px;font-weight:500;
    box-shadow:0 10px 40px rgba(0,0,0,0.15);
    z-index:9999;transition:transform .5s cubic-bezier(.34,1.56,.64,1),opacity .4s;
    max-width:90%;backdrop-filter:blur(4px);
    display:flex;align-items:center;gap:12px;
    border:1px solid rgba(255,255,255,0.2);
    opacity:0;
  `;
  toast.innerHTML=`<i class="fas ${icons[type]}"></i> ${message}`;
  document.body.appendChild(toast);
  requestAnimationFrame(()=>{toast.style.opacity='1';toast.style.transform='translateX(-50%) translateY(0)';});
  setTimeout(()=>{toast.style.opacity='0';toast.style.transform='translateX(-50%) translateY(-120px)';setTimeout(()=>toast.remove(),500);},3500);
}

// 在用户列表渲染前批量查询一次，避免每位作者独立发起 4~5 次网络请求。
async function primeUserDisplayCache(people){
  const now=Date.now();
  const ids=[...new Set((people||[]).filter(Boolean).map(p=>p.id).filter(Boolean))]
    .filter(id=>!userColorCache.has(id)||now-userColorCache.get(id).at>DISPLAY_CACHE_MS);
  if(!ids.length)return;
  // Supabase 默认返回上限为 1000 行，达到上限时回退为按用户精确统计，避免算错等级。
  for(let offset=0;offset<ids.length;offset+=40){
    const batch=ids.slice(offset,offset+40);
    const [n,c,r,t]=await Promise.all([
      supabaseClient.from('novels').select('author_id').in('author_id',batch).eq('approval_status','approved'),
      supabaseClient.from('daily_checkins').select('user_id').in('user_id',batch),
      supabaseClient.from('ratings').select('user_id,score').in('user_id',batch),
      supabaseClient.from('user_equipped_titles').select('user_id,title_type,reward_titles(title,color)').in('user_id',batch)
    ]);
    if(!t.error){
      const equipped=new Map((t.data||[]).map(x=>[x.user_id,x]));
      for(const id of batch)if(!rewardCache.has(id))rewardCache.set(id,equipped.get(id)||null);
    }
    if(n.error||c.error||r.error||[n.data?.length,c.data?.length,r.data?.length].some(v=>v>=1000))continue;
    const novels=new Map(),days=new Map(),rating=new Map();
    for(const item of n.data||[])novels.set(item.author_id,(novels.get(item.author_id)||0)+1);
    for(const item of c.data||[])days.set(item.user_id,(days.get(item.user_id)||0)+1);
    for(const item of r.data||[])rating.set(item.user_id,(rating.get(item.user_id)||0)+Number(item.score||0));
    for(const id of batch)userColorCache.set(id,{
      at:Date.now(),color:computedUserColor(novels.get(id)||0,days.get(id)||0,rating.get(id)||0)
    });
  }
  if(userColorCache.size>1000){
    for(const [id,item] of userColorCache)if(Date.now()-item.at>DISPLAY_CACHE_MS)userColorCache.delete(id);
  }
}
async function getUserNameColor(p){
  if(!p)return '#1e293b';
  if(isMuted(p))return '#8B6914';
  if(p.role==='admin')return '#FFD700';
  if(!p.id)return '#1e293b';
  const cached=userColorCache.get(p.id);
  if(cached&&Date.now()-cached.at<DISPLAY_CACHE_MS)return cached.color;
  if(userColorInflight.has(p.id))return userColorInflight.get(p.id);
  const request=(async()=>{
    const [n,c,r]=await Promise.all([
      supabaseClient.from('novels').select('id',{count:'exact',head:true}).eq('author_id',p.id).eq('approval_status','approved'),
      supabaseClient.from('daily_checkins').select('user_id',{count:'exact',head:true}).eq('user_id',p.id),
      supabaseClient.from('ratings').select('score').eq('user_id',p.id)
    ]);
    const color=computedUserColor(n.count||0,c.count||0,(r.data||[]).reduce((sum,row)=>sum+Number(row.score||0),0));
    userColorCache.set(p.id,{color,at:Date.now()});
    return color;
  })().finally(()=>userColorInflight.delete(p.id));
  userColorInflight.set(p.id,request);
  return request;
}

// 管理员称号和签到称号使用完全一致的徽章样式，同时只能显示一个。
function titleBadge(title,color){
  const safe=/^#[0-9a-fA-F]{6}$/.test(color||'')?color:'#eab308';
  return `<span class="username-label" style="background:${safe}22;color:${safe};border:1px solid ${safe};text-decoration:none">${esc(title)}</span>`;
}
async function getUserLabel(p){
  if(!p)return '';
  if(isMuted(p))return '<span class="username-label label-violator">违规者</span>';
  // 部分作者或评论查询只提供了 username，需要按用户名查找完整用户信息。
  if(!p.id && p.username){
    const {data}=await supabaseClient.from('profiles').select('id,role,label').eq('username',p.username).maybeSingle();
    if(data)p={...p,...data};
  }
  if(!p.id)return p.role==='admin'?titleBadge(p.label||'管理员','#FFD700'):'';
  if(!rewardCache.has(p.id)){
    const {data,error}=await supabaseClient.from('user_equipped_titles')
      .select('title_type,reward_titles(title,color)').eq('user_id',p.id).maybeSingle();
    if(error)console.warn('读取佩戴称号失败',error);
    rewardCache.set(p.id,data||null);
  }
  const equipped=rewardCache.get(p.id);
  if(equipped?.title_type==='none')return '';
  if(equipped?.title_type==='reward'){
    const r=equipped.reward_titles;
    return r?titleBadge(r.title,r.color):'';
  }
  if(p.role==='admin')return titleBadge(p.label||'管理员','#FFD700');
  return '';
}

async function formatUsername(p,showLabel=true){
  if(!p)return '未知';
  const color=await getUserNameColor(p);
  let labelHtml=showLabel?await getUserLabel(p):'';
  return `<span style="color:${color};font-weight:600;">${esc(p.username)}</span> ${labelHtml}`;
}

// 路由切换只读缓存，不再每次重新下载整个个人资料；主动编辑后仍强制刷新。
async function loadProfile(force=true){
  if(!user)return;

  const {data,error}=await supabaseClient.from('profiles').select('*').eq('id',user.id).single();

  else if(!profile)console.warn('加载个人资料失败',error);
}

async function doLogin(){

  const e=document.getElementById('err');
  if(!u||!p)return e.textContent='请输入用户名和密码';
  const {data:pf}=await supabaseClient.from('profiles').select('email').eq('username',u).single();
  if(!pf)return e.textContent='用户名不存在';
  const {data,error}=await supabaseClient.auth.signInWithPassword({email:pf.email,password:p});
  if(error)return e.textContent='密码错误';
  closeModal();user=data.user;await loadProfile();render();
  showToast('登录成功！欢迎回来','success');
}

async function doRegister(){
  const u=document.getElementById('ruser').value.trim(),em=document.getElementById('remail').value.trim(),pw=document.getElementById('rpass').value;
  const e=document.getElementById('err');e.textContent='';
  if(!u||!em||!pw)return e.textContent='请填写完整';
  if(pw.length<6)return e.textContent='密码至少6位';
  const {data:exist}=await supabaseClient.from('profiles').select('id').or(`username.eq."${u}",email.eq."${em}"`).maybeSingle();
  if(exist)return e.textContent='用户名或邮箱已被注册';
  const {data:signUpData,error:signUpError}=await supabaseClient.auth.signUp({email:em,password:pw});
  if(signUpError)return e.textContent=signUpError.message;
  if(!signUpData?.user)return e.textContent='注册失败';
  if(!signUpData.session){
    const {data:loginData,error:loginError}=await supabaseClient.auth.signInWithPassword({email:em,password:pw});
    if(loginError){closeModal();showToast('注册成功！请手动登录','info');return render();}
    user=loginData.user;
  }else{await supabaseClient.auth.setSession(signUpData.session);user=signUpData.user;}
  const role=em==='18631167199@163.com'?'admin':'user';
  const label=role==='admin'?'管理员':'';
  const label_changes=role==='admin'?(em==='18631167199@163.com'?999:1):0;
  await supabaseClient.from('profiles').upsert({id:user.id,username:u,email:em,role,label,label_changes_remaining:label_changes,permissions:[]});
  closeModal();await loadProfile();render();
  showToast('注册成功！','success');
}

let homeLeaderboardCache={at:0,promise:null};
async function loadHomeLeaderboard(){
  if(homeLeaderboardCache.promise&&Date.now()-homeLeaderboardCache.at<30000)return homeLeaderboardCache.promise;
  const promise=(async()=>{
    const {data:allNovels,error}=await supabaseClient.from('novels')
      .select('id,title,cover_url,profiles(id,username)').eq('approval_status','approved');
    if(error||!allNovels?.length)return [];
    // 查询评分只下载必要字段，且合并多本小说的请求。
    const ids=allNovels.map(n=>n.id),scoreMap=new Map();
    for(let start=0;start<ids.length;start+=150){
      const {data:ratings}=await supabaseClient.from('ratings').select('novel_id,score').in('novel_id',ids.slice(start,start+150));
      (ratings||[]).forEach(r=>{
        const stat=scoreMap.get(r.novel_id)||{sum:0,count:0};
        stat.sum+=Number(r.score||0);stat.count++;
        scoreMap.set(r.novel_id,stat);
      });
    }
    return allNovels.map(n=>{
      const {sum=0,count=0}=scoreMap.get(n.id)||{};
      return {...n,count,avg:count?Number((sum/count).toFixed(1)):0};
    }).sort((a,b)=>b.avg-a.avg).slice(0,5);
  })().catch(e=>{console.warn('排行榜加载失败',e);return [];});
  homeLeaderboardCache={at:Date.now(),promise};
  return promise;
}

let quillInstance = null;
async function uploadQuillImage(file) {
  const ext = file.name.split('.').pop();
  const path = `quill_${Date.now()}_${Math.random().toString(36).substring(2,8)}.${ext}`;
  const { error } = await supabaseClient.storage.from('posts').upload(path, file);
  if (error) { showToast('图片上传失败：'+error.message,'error'); return null; }
  const { data:{publicUrl} } = supabaseClient.storage.from('posts').getPublicUrl(path);
  return publicUrl;
}
function initQuill(containerId, initialContent = '') {
  if (quillInstance) { if(typeof quillInstance.destroy==='function')quillInstance.destroy(); quillInstance = null; }
  const container = document.getElementById(containerId);
  if (!container) return null;
  const toolbarOptions = [
    ['bold','italic','underline','strike'],
    ['blockquote','code-block'],
    [{ 'list':'ordered'},{'list':'bullet'}],
    ['link','image'],
    ['clean']
  ];
  const quill = new Quill(container, { theme:'snow', modules:{toolbar:toolbarOptions}, placeholder:'在这里写内容...' });
  if (initialContent) quill.root.innerHTML = initialContent;
  const toolbar = quill.getModule('toolbar');
  toolbar.addHandler('image', function() {
    const input = document.createElement('input');
    input.setAttribute('type','file');
    input.setAttribute('accept','image/*');
    input.click();
    input.onchange = async function() {
      const file = this.files[0];
      if (!file) return;
      const url = await uploadQuillImage(file);
      if (url) {
        const range = quill.getSelection(true);
        quill.insertEmbed(range.index, 'image', url);
        quill.setSelection(range.index+1, 0);
      }
    };
  });
  quillInstance = quill;
  return quill;
}

async function chapterContent(container,chapterId){
  const {data:chapter}=await supabaseClient.from('chapters').select('*').eq('id',chapterId).maybeSingle();
  if(!chapter)return container.innerHTML+='<p>章节不存在</p>';

  const {data:allChapters}=await supabaseClient.from('chapters').select('id,chapter_number').eq('novel_id',novel.id).order('chapter_number');
  const list=allChapters||[];
  const idx=list.findIndex(ch=>ch.id==chapterId);
  const prev=idx>0?list[idx-1]:null;
  const next=idx<list.length-1?list[idx+1]:null;
  if(user)saveReadingProgress(novel,chapter);
  const {data:comments}=await supabaseClient.from('comments').select('*,profiles(id,username,role,muted_until,label)').eq('novel_id',novel.id).eq('chapter_id',chapterId).order('created_at',{ascending:true});

    displayContent = displayContent.replace(/<script[^>]*>[\s\S]*?<\/script>/gi, '');

  for(const item of owned||[]){
    const r=item.reward_titles;if(!r)continue;
    const row=document.createElement('div');row.className='flex-row';
    const details=document.createElement('div');
    details.innerHTML=titleBadge(r.title,r.color);
    const date=document.createElement('div');date.className='meta';date.textContent='奖励日期：'+r.reward_date;
    details.appendChild(date);row.appendChild(details);
    const btn=document.createElement('button');
    const active=current==='reward'&&equipped?.reward_id===item.reward_id;
    btn.textContent=active?'已佩戴':'佩戴';btn.disabled=active;if(!active)btn.className='outline';
    btn.onclick=()=>equipUserTitle('reward',item.reward_id);
    row.appendChild(btn);el.appendChild(row);
  }
}
async function equipUserTitle(type,rewardId=null){

  // 数据库校验奖励归属，用户不能佩戴别人的奖励称号。

}

async function communityList(container){
  const card=document.createElement('div');card.className='card';
  card.innerHTML='<h2><i class="fas fa-comments"></i> 社区</h2>';
  if(user&&!isMuted(profile))card.innerHTML+=`<button onclick="openNewPostModal()" style="margin-bottom:10px;"><i class="fas fa-plus"></i> 发帖</button>`;
  else if(isMuted(profile))card.innerHTML+='<p style="color:red;">你已被禁言</p>';
  const postList=document.createElement('div');card.appendChild(postList);
  const more=document.createElement('button');more.className='outline';more.style.marginTop='14px';
  more.textContent='加载更多帖子';card.appendChild(more);
  container.appendChild(card);
  let offset=0;
  async function loadMore(){
    more.disabled=true;more.textContent='加载中...';
    const {data:posts,error}=await supabaseClient.from('posts')
      .select('id,title,created_at,like_count,dislike_count,is_pinned,profiles(id,username,role,muted_until,label)')
      .eq('approval_status','approved').order('is_pinned',{ascending:false}).order('created_at',{ascending:false})
      .range(offset,offset+49);
    if(error){more.disabled=false;more.textContent='加载失败，点击重试';return;}
    if(!posts?.length){
      if(!offset)postList.innerHTML='<p>暂无帖子</p>';
      more.remove();return;
    }
    await primeUserDisplayCache(posts.map(p=>p.profiles));
    const fragment=document.createDocumentFragment();
    for(const p of posts){
      const authorFormatted=p.profiles?await formatUsername(p.profiles,true):'未知';
      const div=document.createElement('div');div.className='post-item';
      div.innerHTML=`${p.is_pinned?'<span style="background:#0f172a;color:#fff;padding:2px 10px;border-radius:40px;font-size:11px;margin-right:6px;">置顶</span> ':''}<a onclick="navigate('#post/${p.id}')" class="post-title">${esc(p.title)}</a><div class="post-meta">${authorFormatted} · ${new Date(p.created_at).toLocaleString()} · <i class="fas fa-thumbs-up"></i> ${p.like_count||0} · <i class="fas fa-thumbs-down"></i> ${p.dislike_count||0}</div>`;
      fragment.appendChild(div);
    }
    postList.appendChild(fragment);
    offset+=posts.length;
    if(posts.length<50)more.remove();
    else{more.disabled=false;more.textContent='加载更多帖子';}
  }
  more.onclick=loadMore;
  await loadMore();
}

function openNewPostModal(){
  if(isMuted(profile))return showToast('你已被禁言','error');
  const modalHtml = `
    <div class="modal"><div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <h3>发布帖子</h3>
      <input id="post-title" placeholder="标题（至少2个字）">
      <div id="quill-editor-post" class="quill-editor"></div>
      <label style="display:flex;align-items:center;gap:8px;margin-top:12px;"><input type="checkbox" id="create-poll-toggle" style="width:auto;margin:0"> 添加投票</label>
      <div id="create-poll-fields" class="hidden" style="margin-top:8px;">
        <input id="poll-question" maxlength="150" placeholder="投票问题（可留空，默认使用帖子标题）">
        <div id="poll-options"><input maxlength="100" placeholder="选项 1"><input maxlength="100" placeholder="选项 2"></div>
        <button type="button" class="outline" id="add-poll-option" style="margin-top:8px;">+ 添加选项</button>
        <small class="meta">单选，每人仅能投一次；最少2项，最多10项。</small>
      </div>
      <button id="post-submit" style="width:100%;margin-top:12px;">提交</button>
      <div id="err" style="color:red;"></div>
    </div></div>
  `;
  document.getElementById('modal-container').innerHTML = modalHtml;
  const quill = initQuill('quill-editor-post', '');
  const pollToggle=document.getElementById('create-poll-toggle');
  pollToggle.onchange=()=>document.getElementById('create-poll-fields').classList.toggle('hidden',!pollToggle.checked);
  document.getElementById('add-poll-option').onclick=()=>{
    const el=document.getElementById('poll-options');
    if(el.children.length>=10)return showToast('最多10个选项','warning');
    const input=document.createElement('input');input.maxLength=100;input.placeholder='选项 '+(el.children.length+1);el.appendChild(input);
  };
  document.getElementById('post-submit').onclick = async function() {
    const title = document.getElementById('post-title').value.trim();
    const content = quill.root.innerHTML;
    if (!title || !content) { document.getElementById('err').textContent = '请填写标题和内容'; return; }
    if (containsBanned(title) || containsBanned(content)) {
      await addViolation(user.id, '发布违规帖子');
      document.getElementById('err').textContent = '内容违规，已记录违规';
      return;
    }
    const pollEnabled=pollToggle.checked;
    const options=pollEnabled?Array.from(document.querySelectorAll('#poll-options input')).map(i=>i.value.trim()):[];
    if(pollEnabled&&(options.length<2||options.some(o=>!o)||new Set(options).size!==options.length))return document.getElementById('err').textContent='请填写至少两个不重复的投票选项';
    if(pollEnabled&&(containsBanned(options.join(' '))||containsBanned(document.getElementById('poll-question').value)))return document.getElementById('err').textContent='投票包含违规词';
    const submit=document.getElementById('post-submit');submit.disabled=true;
    const {data:newPost,error}=await supabaseClient.from('posts').insert({ author_id: user.id, title, content, approval_status: 'pending' }).select('id').single();
    if(error){submit.disabled=false;document.getElementById('err').textContent=error.message;return;}
    if(pollEnabled){
      const question=document.getElementById('poll-question').value.trim()||title;
      const {error:pollError}=await supabaseClient.rpc('create_community_poll',{p_post_id:newPost.id,p_question:question,p_options:options});
      if(pollError){submit.disabled=false;document.getElementById('err').textContent='帖子已创建，但投票创建失败：'+pollError.message;return;}
    }
    showToast('提交成功，等待审核','success');
    closeModal();
    navigate('#community');
  };
}

async function postDetail(container,postId){
  const {data:post}=await supabaseClient.from('posts').select('*,profiles(id,username,role,muted_until,label)').eq('id',postId).single();
  if(!post)return container.innerHTML+='<p>帖子不存在</p>';
  const authorFormatted=post.profiles?await formatUsername(post.profiles,true):'未知';
  let userVote=null;
  if(user){
    const {data:vote}=await supabaseClient.from('post_votes').select('*').eq('post_id',postId).eq('user_id',user.id).maybeSingle();
    userVote=vote?.vote_type||null;
  }
  const card=document.createElement('div');card.className='card';
  let displayContent = post.content;
  const isHtml = /<[a-z][\s\S]*>/i.test(displayContent);
  if (isHtml) {
    displayContent = displayContent.replace(/<script[^>]*>[\s\S]*?<\/script>/gi, '');
    displayContent = displayContent.replace(/<iframe[^>]*>[\s\S]*?<\/iframe>/gi, '');
  } else {
    displayContent = marked.parse(displayContent);
  }
  card.innerHTML=`
    <a onclick="navigate('#community')" style="font-size:12px;"><i class="fas fa-arrow-left"></i> 社区</a>
    <h2>${esc(post.title)}</h2>
    <div class="post-meta">${authorFormatted} · ${new Date(post.created_at).toLocaleString()}</div>
    <div style="margin:12px 0;">${displayContent}</div>
    <div class="vote-btns">
      <button onclick="votePost(${post.id},'like')" class="${userVote==='like'?'active':''}"><i class="fas fa-thumbs-up"></i> ${post.like_count||0}</button>
      <button onclick="votePost(${post.id},'dislike')" class="${userVote==='dislike'?'active':''}"><i class="fas fa-thumbs-down"></i> ${post.dislike_count||0}</button>
      ${profile?.role==='admin'?`<button onclick="togglePin(${post.id})">${post.is_pinned?'取消置顶':'置顶'}</button> <button class="danger" onclick="deletePost(${post.id})">删除</button>`:''}
    </div>
  `;
  container.appendChild(card);
  await renderCommunityPoll(container,postId);
  const {data:replies}=await supabaseClient.from('post_replies').select('*,profiles(id,username,role,muted_until,label)').eq('post_id',postId).order('created_at',{ascending:true});
  const replyCard=document.createElement('div');replyCard.className='card';
  replyCard.innerHTML='<h3><i class="fas fa-reply-all"></i> 回复</h3>';
  if(replies?.length){
    await primeUserDisplayCache(replies.map(r=>r.profiles));
    const childrenByParent=new Map();
    for(const reply of replies){
      const parentId=reply.parent_id==null?null:String(reply.parent_id);
      if(!childrenByParent.has(parentId))childrenByParent.set(parentId,[]);
      childrenByParent.get(parentId).push(reply);
    }
    for(const r of childrenByParent.get(null)||[])replyCard.appendChild(await renderReply(r,childrenByParent));
  }else replyCard.innerHTML+='<p>暂无回复</p>';
  if(user&&!isMuted(profile))replyCard.innerHTML+=`<textarea id="reply-content" placeholder="写下你的回复..." rows="3" style="margin-top:10px;"></textarea><button onclick="window.addTopReply(${post.id})" style="margin-top:6px;"><i class="fas fa-paper-plane"></i> 回复</button>`;
  else if(isMuted(profile))replyCard.innerHTML+='<p style="color:red;">你已被禁言</p>';
  else replyCard.innerHTML+='<p>登录后可回复</p>';
  container.appendChild(replyCard);
}

window.addTopReply=async function(postId){
  if(isMuted(profile))return showToast('你已被禁言','error');
  const content=document.getElementById('reply-content').value.trim();
  if(!content)return showToast('内容不能为空','error');
  if(containsBanned(content)){await addViolation(user.id,'违规回复');return showToast('包含违规词，已记录违规','error');}
  await supabaseClient.from('post_replies').insert({post_id:postId,author_id:user.id,content,parent_id:null});
  showToast('回复成功','success');
  navigate(`#post/${postId}`);
};

async function renderReply(reply,allReplies,depth=0){
  const authorFormatted=reply.profiles?await formatUsername(reply.profiles,true):'未知';
  const div=document.createElement('div');
  div.className='reply-item';
  div.style.marginLeft=depth>0?'20px':'0';
  div.innerHTML=`<strong>${authorFormatted}</strong> <small class="meta">${new Date(reply.created_at).toLocaleString()}</small><div>${esc(reply.content).replace(/\n/g,'<br>')}</div>${user&&!isMuted(profile)?`<a onclick="window.openReplyForm(${reply.id})" style="font-size:12px;cursor:pointer;">回复</a>`:''}${profile?.role==='admin'?`<a onclick="window.deleteReply(${reply.id})" class="danger" style="font-size:12px;cursor:pointer;margin-left:8px;">删除</a>`:''}<div id="reply-form-${reply.id}" style="display:none;margin-top:6px;"></div>`;
  const children=allReplies instanceof Map?(allReplies.get(String(reply.id))||[]):allReplies.filter(r=>r.parent_id===reply.id);
  for(const ch of children){
    div.appendChild(await renderReply(ch,allReplies,depth+1));
  }
  return div;
}

window.openReplyForm=function(replyId){
  const formDiv=document.getElementById(`reply-form-${replyId}`);
  formDiv.style.display='block';
  formDiv.innerHTML=`<textarea id="child-reply-${replyId}" rows="2" placeholder="回复..."></textarea><button onclick="window.addChildReply(${replyId})" style="margin-top:4px;">提交</button>`;
};

window.addChildReply=async function(parentId){
  if(isMuted(profile))return showToast('你已被禁言','error');
  const content=document.getElementById(`child-reply-${parentId}`).value.trim();
  if(!content)return showToast('内容不能为空','error');
  if(containsBanned(content)){await addViolation(user.id,'违规回复');return showToast('包含违规词，已记录违规','error');}
  const {data:parent}=await supabaseClient.from('post_replies').select('post_id').eq('id',parentId).single();
  if(!parent)return;
  await supabaseClient.from('post_replies').insert({post_id:parent.post_id,author_id:user.id,content,parent_id:parentId});

window.deleteReply=async function(replyId){
  if(!confirm('删除回复？'))return;
  const {data:reply}=await supabaseClient.from('post_replies').select('post_id').eq('id',replyId).single();
  await supabaseClient.from('post_replies').delete().eq('id',replyId);

async function votePost(postId,type){
  if(!user)return showToast('请先登录','error');
  const {data:existing}=await supabaseClient.from('post_votes').select('*').eq('post_id',postId).eq('user_id',user.id).maybeSingle();
  if(existing){
    if(existing.vote_type===type)await supabaseClient.from('post_votes').delete().eq('id',existing.id);
    else await supabaseClient.from('post_votes').update({vote_type:type}).eq('id',existing.id);
  }else await supabaseClient.from('post_votes').insert({post_id:postId,user_id:user.id,vote_type:type});
  await updateVoteCounts(postId);
  navigate(`#post/${postId}`);
}

async function updateVoteCounts(postId){
  const {data:likes}=await supabaseClient.from('post_votes').select('*').eq('post_id',postId).eq('vote_type','like');
  const {data:dislikes}=await supabaseClient.from('post_votes').select('*').eq('post_id',postId).eq('vote_type','dislike');
  await supabaseClient.from('posts').update({like_count:(likes||[]).length,dislike_count:(dislikes||[]).length}).eq('id',postId);
}

async function togglePin(postId){
  const {data:post}=await supabaseClient.from('posts').select('is_pinned').eq('id',postId).single();
  await supabaseClient.from('posts').update({is_pinned:!post.is_pinned}).eq('id',postId);
  navigate(`#post/${postId}`);
}

function openPointsProductEditor(product=null){
  if(!hasPermission('上架积分商品'))return showToast('无权上架商品','error');
  openGenericForm(product?'编辑积分商品':'发布积分商品',`
    <label>商品名称<input id="pp-name" maxlength="100" value="${esc(product?.title||'')}" placeholder="商品名称"></label>
    <label>详细介绍<textarea id="pp-desc" maxlength="2000" rows="4" placeholder="描述兑换内容和交付方式">${esc(product?.description||'')}</textarea></label>
    <label>积分价格<input id="pp-price" type="number" min="1" max="100000000" step="1" value="${product?.price||''}" placeholder="例如：100"></label>
    <label>商品库存<input id="pp-stock" type="number" min="0" max="1000000" step="1" value="${product?.stock??''}" placeholder="留空表示不限库存"></label>
    <label>上传商品图片（可选，最大5MB）<input id="pp-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label>
    <label>或填写图片 HTTPS 链接<input id="pp-image" maxlength="2000" value="${esc(product?.image_url||'')}" placeholder="https://..."></label>
    <label style="display:flex;align-items:center;gap:10px;margin-top:10px"><input id="pp-active" type="checkbox" style="width:auto;margin:0" ${product?.is_active===false?'':'checked'}> 立即上架</label>
  `,async()=>{
    const title=document.getElementById('pp-name').value.trim();
    const desc=document.getElementById('pp-desc').value.trim();
    const priceText=document.getElementById('pp-price').value.trim();
    const stockText=document.getElementById('pp-stock').value.trim();
    const price=Number(priceText);
    const stock=stockText===''?null:Number(stockText);
    if(!title||title.length>100)throw new Error('请输入1至100字的商品名称');
    if(!/^\d+$/.test(priceText)||price<1||price>100000000)throw new Error('请输入有效的积分价格');
    if(stock!==null&&(!/^\d+$/.test(stockText)||stock>1000000))throw new Error('库存需为非负整数，留空表示不限库存');
    let imageUrl=document.getElementById('pp-image').value.trim()||null;
    const file=document.getElementById('pp-file').files[0];
    if(file){
      const extension={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif'}[file.type];
      if(!extension||file.size>5*1024*1024)throw new Error('仅支持 JPG/PNG/WebP/GIF，最大5MB');
      const path=`${user.id}/${Date.now()}-${Math.random().toString(36).slice(2)}.${extension}`;
      const {error:upError}=await supabaseClient.storage.from('point-products').upload(path,file,{contentType:file.type,upsert:false});
      if(upError)throw new Error('商品图片上传失败：'+upError.message);
      imageUrl=supabaseClient.storage.from('point-products').getPublicUrl(path).data.publicUrl;
    }
    const {error}=await supabaseClient.rpc('points_save_product',{
      p_product_id:product?.id||null,p_title:title,p_description:desc,p_price:price,
      p_stock:stock,p_image_url:imageUrl,p_active:document.getElementById('pp-active').checked
    });
    if(error)throw new Error('保存失败：'+pointsError(error));
    showToast(product?'商品修改成功':'商品发布成功','success');
    await adminPointsProducts();
  });
}

async function openPointsTransfer(partnerId,partnerName){
  if(!user)return showToast('请先登录','error');
  if(partnerId===user.id)return showToast('不能给自己转账','error');
  const {balance,error}=await fetchMyPoints();
  if(error)return showToast('无法读取积分余额：'+pointsError(error),'error');
  openGenericForm(`转积分给 ${esc(partnerName)}`,`
    <p class="meta">当前可用积分：<b>${balance}</b>，转账确认后立即到账，不可撤销。</p>
    <label>转账积分<input id="pt-amount" type="number" min="1" step="1" max="100000000" placeholder="输入积分数量"></label>
    <label>备注（选填）<input id="pt-note" maxlength="100" placeholder="想对TA说的话"></label>
  `,async()=>{

    showToast(`转账成功！已发送 ${data.amount} 积分，剩余 ${data.balance} 积分`,'success');
    await render();
  });
}

let messageBadgeLastAt=0,messageBadgeUserId=null;

  const badge=document.getElementById('msg-badge');
  if(!user){if(badge)badge.classList.remove('show');messageBadgeUserId=null;return;}
  if(!force&&messageBadgeUserId===user.id&&Date.now()-messageBadgeLastAt<10000)return;

  const {count,error}=await supabaseClient.from('pm').select('id',{count:'exact',head:true}).eq('receiver_id',user.id).eq('is_read',false);
  if(!error&&badge){badge.textContent=count>99?'99+':count||'';badge.classList.toggle('show',count>0);}

async function messagesPage(container){
  if(!user)return container.innerHTML='<p>请先登录</p>';
  const searchCard=document.createElement('div');searchCard.className='card';
  searchCard.innerHTML=`<h2><i class="fas fa-envelope"></i> 私信</h2><input id="msg-search" placeholder="搜索用户名发起私信..."><div id="msg-search-results" style="margin-top:10px;"></div>`;
  container.appendChild(searchCard);
  const {data:msgs,error}=await supabaseClient.from('pm').select('*').or(`sender_id.eq.${user.id},receiver_id.eq.${user.id}`).order('created_at',{ascending:false}).limit(200);
  if(error){container.innerHTML+='<p>加载私信失败：'+esc(error.message)+'</p>';return;}
  const conversations=new Map();const unreadCounts=new Map();
  (msgs||[]).forEach(m=>{
    const otherId=m.sender_id===user.id?m.receiver_id:m.sender_id;
    if(!conversations.has(otherId))conversations.set(otherId,m);
    if(m.receiver_id===user.id&&!m.is_read)unreadCounts.set(otherId,(unreadCounts.get(otherId)||0)+1);
  });
  const ids=Array.from(conversations.keys());
  const listCard=document.createElement('div');listCard.className='card';listCard.innerHTML='<h3>最近会话</h3>';
  if(ids.length){
    const {data:people}=await supabaseClient.from('profiles').select('*').in('id',ids);
    const byId=new Map((people||[]).map(p=>[p.id,p]));
    for(const id of ids){
      const p=byId.get(id);if(!p)continue;
      const m=conversations.get(id),unread=unreadCounts.get(id)||0;
      const div=document.createElement('div');div.className='msg-list-item';div.onclick=()=>navigate(`#chat/${id}`);
      const avatar=p.avatar_url?`<img src="${esc(p.avatar_url)}" alt="头像">`:esc((p.username||'?')[0]);
      div.innerHTML=`<div class="msg-avatar">${avatar}</div><div class="msg-content"><div class="username">${esc(p.username)} ${unread?'<span class="unread-dot"></span>':''}</div><div class="last-msg">${m.sender_id===user.id?'我：':''}${esc((m.content||'').slice(0,60))}</div></div><div class="msg-time">${new Date(m.created_at).toLocaleString()}${unread?`<div style="color:#ef4444">${unread}条未读</div>`:''}</div>`;
      listCard.appendChild(div);
    }
  }else listCard.innerHTML+='<p class="meta">暂无消息</p>';
  container.appendChild(listCard);
  const inp=document.getElementById('msg-search');
  let searchSequence=0;
  inp.addEventListener('input',()=>{
    const kw=inp.value.trim(),results=document.getElementById('msg-search-results');
    const request=++searchSequence;
    clearTimeout(searchTimeout);
    if(!kw){results.innerHTML='';return;}
    searchTimeout=setTimeout(async()=>{
      const {data:people}=await supabaseClient.from('profiles').select('id,username').ilike('username',`%${kw}%`).neq('id',user.id).limit(8);
      if(request!==searchSequence||inp.value.trim()!==kw||!results.isConnected)return;
      results.innerHTML=(people||[]).map(p=>`<div class="msg-list-item" onclick="navigate('#chat/${p.id}')">${esc(p.username)}</div>`).join('')||'<p class="meta">没有找到用户</p>';
    },350);
  });
}

async function chatPage(container,partnerId){
  if(!user)return container.innerHTML='<p>请先登录</p>';
  const {data:partner}=await supabaseClient.from('profiles').select('*').eq('id',partnerId).maybeSingle();
  if(!partner)return container.innerHTML='<p>用户不存在</p>';
  const {error:readError}=await supabaseClient.from('pm').update({is_read:true}).eq('sender_id',partnerId).eq('receiver_id',user.id).eq('is_read',false);
  if(readError)console.warn('更新私信已读状态失败',readError);
  updateMessageBadge(true);
  const {data:msgs,error}=await supabaseClient.from('pm').select('*').or(`and(sender_id.eq.${user.id},receiver_id.eq.${partnerId}),and(sender_id.eq.${partnerId},receiver_id.eq.${user.id})`).order('created_at',{ascending:false}).limit(200);
  if(error)return container.innerHTML='<p>加载聊天失败：'+esc(error.message)+'</p>';
  const header=document.createElement('div');header.className='chat-header';
  header.innerHTML=`<div class="msg-avatar" style="width:40px;height:40px;margin-right:10px">${partner.avatar_url?`<img src="${esc(partner.avatar_url)}">`:esc(partner.username[0])}</div><b>${esc(partner.username)}</b><div style="margin-left:auto;display:flex;gap:6px;"><button class="gold" id="transfer-points-btn"><i class="fas fa-coins"></i> 转积分</button><button onclick="navigate('#messages')">返回</button></div>`;
  header.querySelector('#transfer-points-btn').onclick=()=>openPointsTransfer(partner.id,partner.username);
  container.appendChild(header);
  const body=document.createElement('div');body.className='chat-body';container.appendChild(body);
  const {data:transferRecords,error:transferError}=await supabaseClient.from('point_transfers')
    .select('pm_id,sender_id,receiver_id,amount,note')
    .or(`and(sender_id.eq.${user.id},receiver_id.eq.${partnerId}),and(sender_id.eq.${partnerId},receiver_id.eq.${user.id})`)
    .limit(500);
  if(transferError)console.warn('加载积分转账凭证失败',transferError);
  const verifiedTransfers=new Map((transferRecords||[]).map(t=>[String(t.pm_id),t]));
  const ids=new Set();
  function appendMessage(m){
    if(m.id!=null&&ids.has(String(m.id)))return;
    if(m.id!=null)ids.add(String(m.id));
    const empty=body.querySelector('[data-empty-chat]');if(empty)empty.remove();
    const outer=document.createElement('div');outer.className='chat-bubble '+(m.sender_id===user.id?'mine':'other');
    const bubble=document.createElement('span');bubble.className='bubble';
    const t=verifiedTransfers.get(String(m.id));
    if(t&&t.sender_id===m.sender_id&&t.receiver_id===m.receiver_id){
      bubble.classList.add('points-transfer-bubble');
      bubble.textContent=`✓ 已验证积分转账：${t.amount} 积分${t.note?'\n备注：'+t.note:''}`;
    }else bubble.textContent=m.content||'';
    const time=document.createElement('div');time.className='time';time.textContent=new Date(m.created_at||Date.now()).toLocaleString();
    outer.append(bubble,time);body.appendChild(outer);body.scrollTop=body.scrollHeight;
  }
  if(msgs?.length)[...msgs].reverse().forEach(appendMessage);
  else body.innerHTML='<p data-empty-chat style="text-align:center;color:#94a3b8">暂无消息</p>';
  const channel=supabaseClient.channel(`pm-chat-${user.id}-${partnerId}-${Date.now()}`)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'pm',filter:`receiver_id=eq.${user.id}`},async payload=>{
      const m=payload.new;
      if(m.sender_id!==partnerId||location.hash!==`#chat/${partnerId}`)return;
      const {data:t}=await supabaseClient.from('point_transfers').select('pm_id,sender_id,receiver_id,amount,note').eq('pm_id',String(m.id)).maybeSingle();
      if(t)verifiedTransfers.set(String(t.pm_id),t);
      appendMessage(m);
      await supabaseClient.from('pm').update({is_read:true}).eq('id',m.id).eq('receiver_id',user.id);
      updateMessageBadge(true);
    }).subscribe();
  currentChatChannel=channel;
  const area=document.createElement('div');area.className='chat-input-area';
  area.innerHTML='<textarea id="msg-input" rows="2" placeholder="输入消息...（Shift+Enter换行）"></textarea><button id="send-btn"><i class="fas fa-paper-plane"></i> 发送</button>';
  container.appendChild(area);
  const input=area.querySelector('textarea'),btn=area.querySelector('button');
  btn.onclick=async()=>{
    const content=input.value.trim();if(!content||btn.disabled)return;
    btn.disabled=true;
    const {data,error:sendError}=await supabaseClient.from('pm').insert({sender_id:user.id,receiver_id:partnerId,content}).select('*').single();
    btn.disabled=false;
    if(sendError){showToast('发送失败：'+sendError.message,'error');return;}
    input.value='';appendMessage(data);input.focus();
  };
  input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();btn.click();}});
  body.scrollTop=body.scrollHeight;
}

async function renderCommunityPoll(container,postId){
  const {data:poll,error}=await supabaseClient.from('community_polls').select('id,question').eq('post_id',postId).maybeSingle();
  if(error){console.warn('读取社区投票失败，请执行 SQL',error);return;}
  if(!poll)return;
  const card=document.createElement('div');card.className='card';container.appendChild(card);
  async function refresh(){
    const [{data:options,error:optError},{data:votes,error:voteError}]=await Promise.all([
      supabaseClient.from('community_poll_options').select('id,label,position').eq('poll_id',poll.id).order('position'),
      supabaseClient.from('community_poll_votes').select('option_id,user_id').eq('poll_id',poll.id)
    ]);
    if(optError||voteError){card.textContent='投票加载失败，请检查数据库权限：'+(optError||voteError).message;return;}
    const mine=(votes||[]).find(v=>v.user_id===user?.id),total=(votes||[]).length;
    card.innerHTML=`<h3><i class="fas fa-poll"></i> ${esc(poll.question)}</h3><p class="meta">单选 · ${total}人参与${mine?' · 你已投票':''}</p>`;
    for(const opt of options||[]){
      const count=(votes||[]).filter(v=>v.option_id===opt.id).length,pct=total?Math.round(count/total*100):0;
      const line=document.createElement('div');line.style.margin='12px 0';
      if(user&&!mine){
        const btn=document.createElement('button');btn.className='outline';btn.style.width='100%';btn.textContent=opt.label;
        btn.onclick=async()=>{
          btn.disabled=true;
          const {error:e}=await supabaseClient.from('community_poll_votes').insert({poll_id:poll.id,option_id:opt.id,user_id:user.id});
          if(e)showToast('投票失败：'+e.message,'error');
          await refresh();
        };line.appendChild(btn);
      }else{
        const text=document.createElement('div');text.textContent=`${opt.label} — ${count}票（${pct}%）${mine?.option_id===opt.id?' ✓':''}`;line.appendChild(text);
      }
      const track=document.createElement('div');track.className='poll-track';track.innerHTML=`<div class="poll-fill" style="width:${pct}%"></div>`;line.appendChild(track);card.appendChild(line);
    }
    if(!user){const hint=document.createElement('p');hint.className='meta';hint.textContent='登录后即可参与投票';card.appendChild(hint);}
  }
  await refresh();
}

    const {data:rows}=await supabaseClient.from('comments').select('id,novel_id,user_id,content,created_at').in('novel_id',novels.map(x=>x.id)).neq('user_id',uid).order('created_at',{ascending:false}).limit(150);
    const titles=new Map(novels.map(x=>[String(x.id),x.title]));
    (rows||[]).forEach(r=>items.push({key:'novelcomment:'+r.id,created_at:r.created_at,text:`你的小说《${titles.get(String(r.novel_id))||'小说'}》有新评论：${(r.content||'').slice(0,70)}`,href:`#novel/${r.novel_id}`}));
  }
  const seen=getFavoriteSeenMap();
  // 分批并发查询最新章节，避免收藏 30 本书时串行等待 30 次网络延迟。
  const favList=favorites||[];
  for(let offset=0;offset<favList.length;offset+=8){
    const group=favList.slice(offset,offset+8);
    const latest=await Promise.all(group.map(fav=>supabaseClient.from('chapters').select('id,chapter_number,title').eq('novel_id',fav.novel_id).order('chapter_number',{ascending:false}).limit(1).maybeSingle()));
    group.forEach((fav,index)=>{
      const last=latest[index]?.data;
      if(!last)return;
      if(seen[fav.novel_id]===undefined){seen[fav.novel_id]=Number(last.chapter_number)||0;return;}
      if(Number(last.chapter_number)>Number(seen[fav.novel_id]))items.push({key:`chapter:${fav.novel_id}:${last.chapter_number}`,created_at:new Date().toISOString(),text:`收藏的《${fav.novels?.title||'小说'}》更新：第${last.chapter_number}章 ${last.title}`,href:`#chapter/${last.id}`});
    });
  }
  saveFavoriteSeenMap(seen);
  const dedup=new Map(items.map(i=>[i.key,i]));
  return [...dedup.values()].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
}
async function getNotificationItems(){
  if(!user)return [];
  const cached=notificationItemsCache;
  if(cached.userId===user.id&&cached.promise&&Date.now()-cached.at<60000)return cached.promise;
  const id=user.id;
  const promise=fetchNotificationItemsUncached().catch(e=>{
    if(notificationItemsCache.userId===id)notificationItemsCache={userId:null,at:0,promise:null};
    throw e;
  });
  notificationItemsCache={userId:id,at:Date.now(),promise};
  return promise;
}
async function getReadNotificationKeys(){
  if(!user)return new Set();
  const {data,error}=await supabaseClient.from('user_notification_reads').select('notification_key').eq('user_id',user.id).limit(1000);
  if(error){console.warn('请执行通知升级 SQL',error);return new Set();}
  return new Set((data||[]).map(x=>x.notification_key));
}
async function updateNotificationBadge(){
  const badge=document.getElementById('profile-notif-badge');
  if(!badge||!user)return;
  try{
    const [items,read]=await Promise.all([getNotificationItems(),getReadNotificationKeys()]);
    const n=items.filter(x=>!read.has(x.key)).length;
    badge.textContent=n?`(${n}条未读)`:'（暂无未读）';badge.style.color=n?'#ef4444':'#94a3b8';
  }catch(e){console.warn('统计消息失败',e);}
}
async function markNotificationRead(key,href){

async function markAllNotificationsRead(){
  const items=await getNotificationItems();const read=await getReadNotificationKeys();

  if(rows.length){const {error}=await supabaseClient.from('user_notification_reads').upsert(rows,{onConflict:'user_id,notification_key'});if(error)return showToast(error.message,'error');}

async function notificationsPage(container){
  if(!user)return container.innerHTML='<p>请先登录</p>';
  const card=document.createElement('div');card.className='card';
  card.innerHTML='<h2><i class="fas fa-bell"></i> 我的消息</h2><p class="meta">新回复、小说评论和收藏更新都会出现在这里。</p><button class="outline" onclick="markAllNotificationsRead()">全部标为已读</button><div id="notif-list" style="margin-top:12px">加载中...</div>';

  }
}
