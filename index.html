<script>
// ===== 核心配置 =====
const SUPABASE_URL = 'https://srbibtnvtpygegmtehzb.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_8ET2ng5O0n6phqCtoz3bxA_xTn2cTsi';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const PLACEHOLDER_IMAGE = 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22150%22 height=%22180%22%3E%3Crect fill=%22%23f1f5f9%22 width=%22150%22 height=%22180%22/%3E%3C/svg%3E';
const ZHIPU_API_KEY = '75a65450c3314bdb90525cc13a356c8f.PiDT1xco3uFpfnmh';
const ZHIPU_API_URL = 'https://open.bigmodel.cn/api/paas/v4/chat/completions';

let user = null, profile = null, rendering = false;
let currentChatChannel = null;
let searchTimeout = null;

const BANNED_WORDS = ['傻逼','赌博','色情','敏感词','违法','政治'];
const ALL_PERMISSIONS = ['删除帖子','删除小说','管理评论','管理用户','编辑公告','设置管理员','通过帖子','通过小说'];

// ===== Toast =====
function showToast(message, type = 'info') {
  const colors={success:'#10b981',error:'#ef4444',info:'#3b82f6',warning:'#eab308'};
  const icons={success:'fa-check-circle',error:'fa-exclamation-circle',info:'fa-info-circle',warning:'fa-exclamation-triangle'};
  const toast=document.createElement('div');
  toast.style.cssText=`
    position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-120px);
    background:${colors[type]||colors.info};color:#fff;
    padding:14px 28px;border-radius:60px;font-size:14px;font-weight:500;
    box-shadow:0 10px 40px rgba(0,0,0,0.15);
    z-index:9999;transition:transform .5s cubic-bezier(.34,1.56,.64,1),opacity .4s;
    max-width:90%;backdrop-filter:blur(4px);
    display:flex;align-items:center;gap:12px;
    border:1px solid rgba(255,255,255,0.2);
    opacity:0;
  `;
  toast.innerHTML=`<i class="fas ${icons[type]}"></i> ${message}`;
  document.body.appendChild(toast);
  requestAnimationFrame(()=>{toast.style.opacity='1';toast.style.transform='translateX(-50%) translateY(0)';});
  setTimeout(()=>{toast.style.opacity='0';toast.style.transform='translateX(-50%) translateY(-120px)';setTimeout(()=>toast.remove(),500);},3500);
}

// ===== 工具 =====
function containsBanned(t){return BANNED_WORDS.some(w=>t.includes(w));}
function isContentValid(t,c){if(!t||t.length<1)return false;if(!c||c.length<3)return false;if(/^(.)\1+$/.test(c))return false;if(/^[\s\p{P}]+$/u.test(c))return false;return true;}
function isMuted(p){return p?.muted_until&&new Date(p.muted_until)>new Date();}
function hasPermission(perm){if(!profile)return false;if(profile.email==='18631167199@163.com')return true;return (profile.permissions||[]).includes(perm);}

async function addViolation(userId,reason){
  await supabaseClient.from('user_violations').insert({user_id:userId,reason});
  const {data:p}=await supabaseClient.from('profiles').select('violation_count').eq('id',userId).single();
  let count=(p?.violation_count||0)+1;
  let muted_until=null;
  if(count>=3)muted_until=new Date(Date.now()+86400000).toISOString();
  await supabaseClient.from('profiles').update({violation_count:count,muted_until}).eq('id',userId);
}

async function getUserNameColor(p){
  if(!p)return '#1e293b';
  if(isMuted(p))return '#8B6914';
  if(p.role==='admin')return '#FFD700';
  const {data:novels}=await supabaseClient.from('novels').select('id').eq('author_id',p.id).eq('approval_status','approved');
  const nCount=novels?.length||0;
  const {count:checkinCount}=await supabaseClient.from('daily_checkins').select('*',{count:'exact',head:true}).eq('user_id',p.id);
  const days=checkinCount||0;
  const {data:ratings}=await supabaseClient.from('ratings').select('score').eq('user_id',p.id);
  const total=ratings?.reduce((s,r)=>s+r.score,0)||0;
  const points=nCount*10+days*2+total;
  if(points>=100)return '#eab308';
  if(points>=50)return '#3b82f6';
  if(points>=20)return '#10b981';
  return '#1e293b';
}

// ===== 【关键修正】标签显示逻辑 =====
async function getUserLabel(p){
  if(!p)return '';
  if(isMuted(p))return '<span class="username-label label-violator">违规者</span>';
  // 优先显示自定义标签（如果有），否则管理员显示“管理员”，普通用户无标签
  if(p.label) return `<span class="username-label label-admin">${esc(p.label)}</span>`;
  if(p.role==='admin') return '<span class="username-label label-admin">管理员</span>';
  return '';
}

async function formatUsername(p,showLabel=true){
  if(!p)return '未知';
  const color=await getUserNameColor(p);
  let labelHtml=showLabel?await getUserLabel(p):'';
  return `<span style="color:${color};font-weight:600;">${esc(p.username)}</span> ${labelHtml}`;
}

function navigate(hash){window.location.hash=hash;}
window.onhashchange=()=>render();

// ===== 渲染 =====
async function render(){
  if(rendering)return;
  rendering=true;
  if(currentChatChannel){await supabaseClient.removeChannel(currentChatChannel);currentChatChannel=null;}
  const app=document.getElementById('app');app.innerHTML='';
  const {data:{session}}=await supabaseClient.auth.getSession();
  if(session){user=session.user;await loadProfile();}else{user=null;profile=null;}
  updateMessageBadge();
  const nav=document.createElement('div');nav.className='navbar';
  nav.innerHTML=`<span class="logo" onclick="navigate('#home')"><i class="fas fa-book-open"></i> lyc书库</span>`;
  if(user&&profile){
    const avatarHtml=profile.avatar_url?`<img src="${profile.avatar_url}" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none';this.parentElement.textContent='${profile.username[0]}'">`:profile.username[0];
    const formatted=await formatUsername(profile,true);
    nav.innerHTML+=`<div class="user-badge"><a onclick="navigate('#user/${esc(profile.username)}')" style="display:flex;align-items:center;gap:6px;text-decoration:none;"><div class="avatar-circle">${avatarHtml}</div> ${formatted}</a><button onclick="signOut()" style="font-size:11px;padding:4px 14px;">退出</button></div>`;
  }else{
    nav.innerHTML+=`<div><button onclick="openModal('login')">登录</button><button onclick="openModal('register')" style="margin-left:6px;">注册</button></div>`;
  }
  app.appendChild(nav);
  document.getElementById('admin-nav').classList.toggle('hidden',profile?.role!=='admin');
  const hash=location.hash||'#home';
  if(hash==='#home')await home(app);
  else if(hash==='#bookpile')await bookPile(app);
  else if(hash.startsWith('#novel/')){
    const parts=hash.split('/');
    if(parts.length===3&&parts[2]==='chapters')await chapterList(app,parts[1]);
    else await novelDetail(app,parts[1]);
  }else if(hash.startsWith('#chapter/'))await chapterContent(app,hash.split('/')[1]);
  else if(hash.startsWith('#user/'))await userPage(app,hash.split('/')[1]);
  else if(hash==='#community')await communityList(app);
  else if(hash.startsWith('#post/'))await postDetail(app,hash.split('/')[1]);
  else if(hash==='#messages')await messagesPage(app);
  else if(hash.startsWith('#chat/'))await chatPage(app,hash.split('/')[1]);

async function doRegister(){
  const u=document.getElementById('ruser').value.trim(),em=document.getElementById('remail').value.trim(),pw=document.getElementById('rpass').value;
  const e=document.getElementById('err');e.textContent='';
  if(!u||!em||!pw)return e.textContent='请填写完整';
  if(pw.length<6)return e.textContent='密码至少6位';
  const {data:exist}=await supabaseClient.from('profiles').select('id').or(`username.eq."${u}",email.eq."${em}"`).maybeSingle();
  if(exist)return e.textContent='用户名或邮箱已被注册';
  const {data:signUpData,error:signUpError}=await supabaseClient.auth.signUp({email:em,password:pw});
  if(signUpError)return e.textContent=signUpError.message;
  if(!signUpData?.user)return e.textContent='注册失败';
  if(!signUpData.session){
    const {data:loginData,error:loginError}=await supabaseClient.auth.signInWithPassword({email:em,password:pw});
    if(loginError){closeModal();showToast('注册成功！请手动登录','info');return render();}
    user=loginData.user;
  }else{await supabaseClient.auth.setSession(signUpData.session);user=signUpData.user;}
  const role=em==='18631167199@163.com'?'admin':'user';
  const label=role==='admin'?'管理员':'';
  const label_changes=role==='admin'?(em==='18631167199@163.com'?999:1):0;
  await supabaseClient.from('profiles').upsert({id:user.id,username:u,email:em,role,label,label_changes_remaining:label_changes,permissions:[]});
  closeModal();await loadProfile();render();
  showToast('注册成功！','success');
}

async function performCheckin(button){
  if(!user)return;
  const today=new Date().toISOString().slice(0,10);
  const {data:existing}=await supabaseClient.from('daily_checkins').select('*').eq('user_id',user.id).eq('checkin_date',today).maybeSingle();
  if(existing)return;
  const {data:recent}=await supabaseClient.from('daily_checkins').select('*').eq('user_id',user.id).order('checkin_date',{ascending:false}).limit(1);
  let consecutive=1;
  if(recent&&recent.length){
    const lastDate=new Date(recent[0].checkin_date);
    const diff=Math.floor((new Date(today)-lastDate)/(1000*60*60*24));
    consecutive=(diff===1)?(recent[0].consecutive_days||0)+1:1;
  }
  let points=Math.floor(Math.random()*5)+5;
  if(consecutive>=7)points*=2;
  const {error}=await supabaseClient.from('daily_checkins').insert({user_id:user.id,checkin_date:today,points,consecutive_days:consecutive});
  if(error)return showToast('签到失败','error');
  button.disabled=true;
  button.textContent=`已签到 (${points}积分，连续${consecutive}天)`;
  showToast(`签到成功！获得 ${points} 积分`,'success');
}

    adContainer.appendChild(dotsContainer);
    container.appendChild(adContainer);
    setInterval(()=>{if(ads.length>1){currentAd=(currentAd+1)%ads.length;img.src=ads[currentAd].ad_image_url||PLACEHOLDER_IMAGE;img.onclick=()=>navigate(`#post/${ads[currentAd].id}`);updateDots();}},5000);

async function rateNovel(novelId){

}

async function addNovelComment(novelId){

function addChapter(novelId){

async function publishNovel(){
  if(isMuted(profile))return showToast('你已被禁言','error');
  const title=document.getElementById('ntitle').value.trim(),genre=document.getElementById('ngenre').value.trim(),desc=document.getElementById('ndesc').value.trim();
  if(!title||!desc)return document.getElementById('err').textContent='请填写标题和简介';
  if(!isContentValid(title,desc)||containsBanned(title)||containsBanned(desc)){
    await addViolation(user.id,'发布违规小说');
    return document.getElementById('err').textContent='内容违规或无意义，已记录违规';
  }
  const {error}=await supabaseClient.from('novels').insert({title,genre,description:desc,author_id:user.id,status:'连载中',approval_status:'pending'});
  if(error)return document.getElementById('err').textContent=error.message;
  showToast('提交成功，等待审核','success');
  navigate('#home');
}

async function openNewPostModal(){
  if(isMuted(profile))return showToast('你已被禁言','error');
  openGenericForm('发布帖子',`
    <input id="post-title" placeholder="标题（至少2个字）">
    <textarea id="post-content" rows="4" placeholder="内容（至少3个字）" style="margin-top:6px;"></textarea>
    <input type="file" id="post-image" accept="image/*" style="margin-top:6px;">
    <small style="color:#94a3b8;">可选：上传图片</small>
  `,async ()=>{
    const title=document.getElementById('post-title').value.trim();
    const content=document.getElementById('post-content').value.trim();
    const fileInput=document.getElementById('post-image');
    const file=fileInput.files[0];
    if(!isContentValid(title,content)||containsBanned(title)||containsBanned(content)){
      await addViolation(user.id,'发布违规帖子');
      throw new Error('内容违规或无意义，已记录违规');
    }
    let finalContent=content;
    if(file){
      const path=`post_${Date.now()}_${file.name}`;
      const {error:uploadError}=await supabaseClient.storage.from('posts').upload(path,file);
      if(uploadError)throw new Error('图片上传失败：'+uploadError.message);
      const {data:{publicUrl}}=supabaseClient.storage.from('posts').getPublicUrl(path);
      finalContent+=`\n![image](${publicUrl})`;
    }
    const {error}=await supabaseClient.from('posts').insert({author_id:user.id,title,content:finalContent,approval_status:'pending'});
    if(error)throw error;
    showToast('提交成功，等待审核','success');
    navigate('#community');
  });
}

window.addTopReply=async function(postId){
  if(isMuted(profile))return showToast('你已被禁言','error');
  const content=document.getElementById('reply-content').value.trim();
  if(!content)return showToast('内容不能为空','error');
  if(containsBanned(content)){await addViolation(user.id,'违规回复');return showToast('包含违规词，已记录违规','error');}
  await supabaseClient.from('post_replies').insert({post_id:postId,author_id:user.id,content,parent_id:null});
  showToast('回复成功','success');
  navigate(`#post/${postId}`);
};

async function renderReply(reply,allReplies,depth=0){
  const authorFormatted=reply.profiles?await formatUsername(reply.profiles,true):'未知';
  const div=document.createElement('div');
  div.className='reply-item';
  div.style.marginLeft=depth>0?'20px':'0';
  div.innerHTML=`<strong>${authorFormatted}</strong> <small class="meta">${new Date(reply.created_at).toLocaleString()}</small><div>${esc(reply.content).replace(/\n/g,'<br>')}</div>${user&&!isMuted(profile)?`<a onclick="window.openReplyForm(${reply.id})" style="font-size:12px;cursor:pointer;">回复</a>`:''}${profile?.role==='admin'?`<a onclick="window.deleteReply(${reply.id})" class="danger" style="font-size:12px;cursor:pointer;margin-left:8px;">删除</a>`:''}<div id="reply-form-${reply.id}" style="display:none;margin-top:6px;"></div>`;
  const children=allReplies.filter(r=>r.parent_id===reply.id);
  for(const ch of children){
    div.appendChild(await renderReply(ch,allReplies,depth+1));
  }
  return div;
}

async function votePost(postId,type){
  if(!user)return showToast('请先登录','error');
  const {data:existing}=await supabaseClient.from('post_votes').select('*').eq('post_id',postId).eq('user_id',user.id).maybeSingle();

    if(existing.vote_type===type)await supabaseClient.from('post_votes').delete().eq('id',existing.id);

  }else await supabaseClient.from('post_votes').insert({post_id:postId,user_id:user.id,vote_type:type});
  await updateVoteCounts(postId);
  navigate(`#post/${postId}`);
}

async function updateVoteCounts(postId){

  await supabaseClient.from('posts').update({like_count:(likes||[]).length,dislike_count:(dislikes||[]).length}).eq('id',postId);
}

async function togglePin(postId){

async function messagesPage(container){
  if(!user)return container.innerHTML='<p>请先登录</p>';
  const searchCard=document.createElement('div');searchCard.className='card';
  searchCard.innerHTML=`<h2><i class="fas fa-envelope"></i> 私信</h2><input id="msg-search" placeholder="搜索用户名发起私信..."><div id="msg-search-results" style="margin-top:10px;"></div>`;

  const userIds=Array.from(conversations.keys());

        const avatarHtml=p.avatar_url?`<img src="${p.avatar_url}" style="width:100%;height:100%;object-fit:cover;">`:p.username[0];

            <div class="username" style="display:flex;align-items:center;">${esc(p.username)} ${unread?'<span class="unread-dot"></span>':''}</div>
            <div class="last-msg">${esc(lastMsg?.content?.substring(0,40)||'')}</div>
          </div>
          <div class="msg-time">${lastMsg?new Date(lastMsg.created_at).toLocaleTimeString():''}</div>
        `;
        listCard.appendChild(div);
      }
    }

  }

  if(inp){
    inp.addEventListener('input',async ()=>{

      const resultsDiv=document.getElementById('msg-search-results');
      if(!kw){resultsDiv.innerHTML='';return;}
      const {data:users}=await supabaseClient.from('profiles').select('*').ilike('username',`%${kw}%`).neq('id',user.id).limit(5);
      resultsDiv.innerHTML='';

          resultsDiv.innerHTML+=`<div class="msg-list-item" onclick="navigate('#chat/${u.id}')"><div class="msg-avatar">${u.username[0]}</div><div class="msg-content"><div class="username">${esc(u.username)}</div></div></div>`;
        });
      }
    });
  }
}

// ===== 私信聊天（含 Realtime） =====
async function chatPage(container,partnerId){
  if(!user)return container.innerHTML='<p>请先登录</p>';
  const {data:partner}=await supabaseClient.from('profiles').select('*').eq('id',partnerId).single();
  if(!partner)return container.innerHTML+='<p>用户不存在</p>';
  const {data:unreadMsgs}=await supabaseClient.from('pm').select('id').eq('sender_id',partnerId).eq('receiver_id',user.id).eq('is_read',false);
  if(unreadMsgs?.length){await supabaseClient.from('pm').update({is_read:true}).in('id',unreadMsgs.map(m=>m.id));}
  const {data:msgs}=await supabaseClient.from('pm').select('*').or(`and(sender_id.eq.${user.id},receiver_id.eq.${partnerId}),and(sender_id.eq.${partnerId},receiver_id.eq.${user.id})`).order('created_at',{ascending:true});
  const avatarHtml=partner.avatar_url?`<img src="${partner.avatar_url}" style="width:40px;height:40px;border-radius:50%;object-fit:cover;">`:partner.username[0];
  const header=document.createElement('div');header.className='chat-header';
  header.innerHTML=`<div class="msg-avatar" style="width:40px;height:40px;font-size:16px;margin-right:10px;">${avatarHtml}</div><div style="font-weight:bold;font-size:18px;">${esc(partner.username)}</div><button onclick="navigate('#messages')" style="margin-left:auto;">返回</button>`;
  container.appendChild(header);
  const body=document.createElement('div');body.className='chat-body';body.id=`chat-body-${partnerId}`;
  function appendMessage(msg,isMine){
    const outerDiv=document.createElement('div');outerDiv.className=`chat-bubble ${isMine?'mine':'other'}`;
    const innerDiv=document.createElement('div');
    const bubbleSpan=document.createElement('span');bubbleSpan.className='bubble';
    bubbleSpan.innerHTML=esc(msg.content).replace(/\n/g,'<br>');
    const timeSpan=document.createElement('div');timeSpan.className='time';
    timeSpan.textContent=new Date(msg.created_at||Date.now()).toLocaleTimeString();
    innerDiv.appendChild(bubbleSpan);innerDiv.appendChild(timeSpan);
    outerDiv.appendChild(innerDiv);
    body.appendChild(outerDiv);
    body.scrollTop=body.scrollHeight;
  }
  if(msgs?.length){msgs.forEach(m=>{const isMe=m.sender_id===user.id;appendMessage(m,isMe);});}else{body.innerHTML='<p style="text-align:center;color:#94a3b8;">暂无消息</p>';}
  container.appendChild(body);
  if(currentChatChannel){await supabaseClient.removeChannel(currentChatChannel);currentChatChannel=null;}
  const channel=supabaseClient.channel(`pm-${user.id}-${partnerId}`)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'pm',filter:`receiver_id=eq.${user.id}`},(payload)=>{
      const newMsg=payload.new;
      if(newMsg.sender_id===partnerId){
        const placeholder=body.querySelector('p');
        if(placeholder&&placeholder.style.textAlign==='center')placeholder.remove();
        appendMessage(newMsg,false);
        supabaseClient.from('pm').update({is_read:true}).eq('id',newMsg.id);
        updateMessageBadge();
      }
    })
    .subscribe();
  currentChatChannel=channel;
  const inputArea=document.createElement('div');inputArea.className='chat-input-area';
  inputArea.innerHTML=`<textarea id="msg-input" rows="2" placeholder="输入消息..."></textarea><button id="send-btn" style="margin-left:8px;padding:10px 20px;"><i class="fas fa-paper-plane"></i> 发送</button>`;
  container.appendChild(inputArea);
  document.getElementById('send-btn').onclick=async ()=>{
    const content=document.getElementById('msg-input').value.trim();
    if(!content)return;
    const tempMsg={content,sender_id:user.id,receiver_id:partnerId,created_at:new Date().toISOString()};
    const placeholder=body.querySelector('p');
    if(placeholder&&placeholder.style.textAlign==='center')placeholder.remove();
    appendMessage(tempMsg,true);
    document.getElementById('msg-input').value='';
    body.scrollTop=body.scrollHeight;
    const {error}=await supabaseClient.from('pm').insert({sender_id:user.id,receiver_id:partnerId,content});
    if(error){showToast('发送失败：'+error.message,'error');}
  };
  document.getElementById('msg-input').addEventListener('keydown',(e)=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('send-btn').click();}});
  setTimeout(()=>{body.scrollTop=body.scrollHeight;},100);
}

  for(const u of users){
    const formatted=await formatUsername(u,true);
    c.innerHTML+=`<div style="border-bottom:1px solid #f1f5f9;padding:8px 0;">${formatted} (${u.role}) <button onclick="editUserLabel('${u.id}')">编辑标签</button> <button onclick="toggleMute('${u.id}')">${isMuted(u)?'解除禁言':'禁言1天'}</button> <button class="danger" onclick="resetViolations('${u.id}')">清零违规</button></div>`;
  }
}
function editUserLabel(userId){
  supabaseClient.from('profiles').select('label').eq('id',userId).single().then(({data})=>{
    const currentLabel=data?.label||'';
    openGenericForm('编辑用户标签',`<input id="editlabel" value="${esc(currentLabel)}" placeholder="标签内容">`,async ()=>{
      const newLabel=document.getElementById('editlabel').value.trim();
      await supabaseClient.from('profiles').update({label:newLabel}).eq('id',userId);
      showToast('标签已更新','success');
      adminUsers();
    });
  });
}
async function toggleMute(userId){
  const {data:p}=await supabaseClient.from('profiles').select('muted_until').eq('id',userId).single();
  const muted=p?.muted_until&&new Date(p.muted_until)>new Date();
  if(muted)await supabaseClient.from('profiles').update({muted_until:null}).eq('id',userId);
  else await supabaseClient.from('profiles').update({muted_until:new Date(Date.now()+86400000).toISOString()}).eq('id',userId);
  showToast(muted?'已解除禁言':'已禁言1天','info');
  adminUsers();
}
async function resetViolations(userId){await supabaseClient.from('profiles').update({violation_count:0,muted_until:null}).eq('id',userId);showToast('违规记录已清零','success');adminUsers();}

async function adminComments(){
  const c=document.getElementById('admin-content');c.innerHTML='';
  const {data}=await supabaseClient.from('comments').select('*,profiles(username),novels(title)').order('created_at',{ascending:false});
  if(data?.length)data.forEach(d=>c.innerHTML+=`<div style="border-bottom:1px solid #f1f5f9;padding:8px 0;">${esc(d.profiles?.username)} 评《${esc(d.novels.title)}》：${esc(d.content)} <button class="danger" onclick="deleteComment(${d.id})">删除</button></div>`);
  else c.innerHTML='<p>暂无评论</p>';
}
async function deleteComment(id){if(confirm('删除？')){await supabaseClient.from('comments').delete().eq('id',id);showToast('已删除','success');adminComments();}}

async function adminNovels(){
  const c=document.getElementById('admin-content');c.innerHTML='';
  const {data}=await supabaseClient.from('novels').select('*,profiles(username)').order('updated_at',{ascending:false});
  if(data?.length)data.forEach(d=>c.innerHTML+=`<div style="border-bottom:1px solid #f1f5f9;padding:8px 0;"><b>${esc(d.title)}</b> 作者：${esc(d.profiles?.username)} <button class="danger" style="float:right;" onclick="deleteNovelAdmin('${d.id}')">删除</button></div>`);
  else c.innerHTML='<p>暂无小说</p>';
}
async function deleteNovelAdmin(id){if(confirm('强制删除？')){await supabaseClient.from('novels').delete().eq('id',id);showToast('已删除','success');adminNovels();}}

async function adminPosts(){
  const c=document.getElementById('admin-content');c.innerHTML='';
  const {data:posts}=await supabaseClient.from('posts').select('*,profiles(username)').order('created_at',{ascending:false});
  if(posts?.length)posts.forEach(p=>c.innerHTML+=`<div style="border-bottom:1px solid #f1f5f9;padding:8px 0;"><b>${esc(p.title)}</b> 作者：${esc(p.profiles?.username)} <button class="danger" onclick="deletePost(${p.id})">删除</button></div>`);
  else c.innerHTML='<p>暂无帖子</p>';
}

async function adminAdmins(){
  const c=document.getElementById('admin-content');c.innerHTML='';
  const {data:profiles}=await supabaseClient.from('profiles').select('*');
  if(profiles)profiles.forEach(p=>{
    c.innerHTML+=`<div style="border-bottom:1px solid #f1f5f9;padding:8px 0;">${esc(p.username)} (${p.role}) ${p.email!=='18631167199@163.com'&&p.id!==user.id?`<button onclick="toggleAdmin('${p.id}')">${p.role==='admin'?'撤销':'设为'}管理员</button>`:'<small>（超级管理员）</small>'} <button onclick="openModal('permissions', {id:'${p.id}',username:'${esc(p.username)}',permissions:${JSON.stringify(p.permissions||[])} })">权限</button></div>`;
  });
}
async function toggleAdmin(userId){
  const {data:p}=await supabaseClient.from('profiles').select('role,email').eq('id',userId).single();
  if(p.email==='18631167199@163.com')return showToast('超级管理员不可更改','error');
  await supabaseClient.from('profiles').update({role:p.role==='admin'?'user':'admin'}).eq('id',userId);
  showToast('已更新','success');
  adminAdmins();
}

async function adminMessages(){
  if(profile?.email!=='18631167199@163.com')return;
  const c=document.getElementById('admin-content');c.innerHTML='';
  const {data:messages}=await supabaseClient.from('pm').select('*').order('created_at',{ascending:false}).limit(100);
  if(!messages){c.innerHTML='<p>暂无私信记录</p>';return;}
  const userIds=[...new Set([...messages.map(m=>m.sender_id),...messages.map(m=>m.receiver_id)])];
  const {data:profiles}=await supabaseClient.from('profiles').select('id,username').in('id',userIds);
  const userMap={};if(profiles)profiles.forEach(p=>userMap[p.id]=p.username);
  messages.forEach(m=>{
    const senderName=userMap[m.sender_id]||'未知';
    const receiverName=userMap[m.receiver_id]||'未知';
    c.innerHTML+=`<div style="border-bottom:1px solid #f1f5f9;padding:8px 0;"><b>${esc(senderName)}</b> → <b>${esc(receiverName)}</b>：${esc(m.content)} <small class="meta">${new Date(m.created_at).toLocaleString()}</small></div>`;
  });
}

function editAnnouncement(){
  openGenericForm('编辑公告（支持 Markdown）',`<textarea id="ann" rows="6" placeholder="公告内容..."></textarea><small class="meta">支持 Markdown 语法</small>`,async ()=>{
    const content=document.getElementById('ann').value.trim();
    if(!content)throw new Error('公告不能为空');
    await supabaseClient.from('announcements').insert({content});
    showToast('公告已更新','success');
  });
}

// ===== AI =====
function toggleAiChat(){document.getElementById('ai-chat').classList.toggle('show');}
async function askAi(){
  const input=document.getElementById('ai-input');
  const question=input.value.trim();
  if(!question)return;
  const body=document.getElementById('ai-body');
  body.innerHTML+=`<div style="text-align:right;margin:5px 0;"><span style="background:#334155;color:#fff;padding:6px 14px;border-radius:16px;display:inline-block;">${esc(question)}</span></div>`;
  input.value='';
  try{
    const response=await fetch(ZHIPU_API_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${ZHIPU_API_KEY}`},
      body:JSON.stringify({model:'glm-4',messages:[{role:'user',content:`你是一个书库助手小，你是一个叫lyc的人编写的，你需要读这个书库的所有书，请根据以下问题回答：${question}`}],temperature:0.7})
    });
    const data=await response.json();
    const answer=data.choices?.[0]?.message?.content||'你问的这个东西很有意思，不过我不回。';
    body.innerHTML+=`<div style="text-align:left;margin:5px 0;"><span style="background:#f1f5f9;padding:6px 14px;border-radius:16px;display:inline-block;">${esc(answer)}</span></div>`;
  }catch(e){body.innerHTML+=`<div>请求失败：${e.message}</div>`;}
  body.scrollTop=body.scrollHeight;
}

// ===== 通用工具 =====
function openGenericForm(title,html,cb){
  const container=document.getElementById('modal-container');
  container.innerHTML=`<div class="modal"><div class="modal-content"><span class="close" onclick="closeModal()">&times;</span><h3>${title}</h3><div id="generic-form-body">${html}</div><button id="generic-submit" onclick="submitGenericForm()" style="width:100%;margin-top:12px;">提交</button><div id="generic-err" style="color:red;"></div></div></div>`;
  window.__genericCallback=cb;
}
function submitGenericForm(){
  const cb=window.__genericCallback;
  if(!cb)return;
  const err=document.getElementById('generic-err');
  if(err)err.textContent='';
  cb().then(()=>closeModal()).catch(e=>{if(err)err.textContent=e.message;});
}
function showConfirm(msg,onConfirm){
  const container=document.getElementById('modal-container');
  container.innerHTML=`<div class="modal"><div class="modal-content" style="text-align:center;"><p>${msg}</p><div class="btn-group" style="justify-content:center;margin-top:15px;"><button class="outline" onclick="closeModal()">取消</button><button class="danger" id="confirm-ok">确认</button></div></div></div>`;
  document.getElementById('confirm-ok').onclick=()=>{closeModal();onConfirm();};
}
function esc(text){const div=document.createElement('div');div.textContent=text;return div.innerHTML;}

if(typeof marked!=='undefined')marked.setOptions({breaks:true,gfm:true});
render();
